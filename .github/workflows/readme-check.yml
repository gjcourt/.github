# Reusable: checks a repo's README.md against README-STANDARD.md (structure
# only). Callers: `uses: gjcourt/.github/.github/workflows/readme-check.yml@main`.
# The check script is fetched at the same commit as this workflow file, so a
# caller pinned to a tag or SHA gets a matching script.
name: readme-check
on:
  workflow_call:

permissions:
  contents: read

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gjcourt/.github
          ref: ${{ job.workflow_sha }}
          path: .readme-standard
      - name: Check README structure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          about=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.description // ""')
          python3 .readme-standard/scripts/readme_check.py README.md --description "$about"
